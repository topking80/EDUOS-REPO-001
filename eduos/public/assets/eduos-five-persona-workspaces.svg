<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 300" role="img" aria-labelledby="title desc">
<title id="title">EduOS five persona workspaces</title><desc id="desc">Five connected workspaces for Superintendent, Principal, Teacher, Parent or Guardian, and Pupil, organized around one shared demonstration platform.</desc>
