<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">EduOS layered trust and governance model</title><desc id="d">Conceptual layers for identity, authorization, data boundaries, audit and human review.</desc><rect width="1200" height="520" rx="28" fill="#f4f7fa"/><text x="55" y="62" fill="#245f8b" font-family="Arial" font-size="17" font-weight="700" letter-spacing="3">EDUOS · GOVERNANCE LAYERS</text><text x="55" y="102" fill="#172d43" font-family="Arial" font-size="28" font-weight="700">Trust is enforced at every action boundary</text><g font-family="Arial"><g><rect x="55" y="145" width="1090" height="65" rx="13" fill="#17324c"/><text x="85" y="185" fill="#fff" font-size="21" font-weight="700">01 · Identity</text><text x="380" y="185" fill="#c9d8e5" font-size="16">Signed-in user · federated identity · session context</text></g><g><rect x="95" y="225" width="1050" height="65" rx="13" fill="#245b82"/><text x="125" y="265" fill="#fff" font-size="21" font-weight="700">02 · Authorization</text><text x="450" y="265" fill="#d4e6f2" font-size="16">Server-side role · policy · resource scope</text></g><g><rect x="135" y="305" width="1010" height="65" rx="13" fill="#39799b"/><text x="165" y="345" fill="#fff" font-size="21" font-weight="700">03 · Data boundaries</text><text x="490" y="345" fill="#e2eff6" font-size="16">Minimum necessary · tenant and learner scope</text></g><g><rect x="175" y="385" width="970" height="65" rx="13" fill="#d8e8ef" stroke="#8cb1c5"/><text x="205" y="425" fill="#17324c" font-size="21" font-weight="700">04 · Audit &amp; human review</text><text x="570" y="425" fill="#35556d" font-size="16">Traceable events · approval for consequential actions</text></g></g><text x="600" y="490" text-anchor="middle" fill="#647b8d" font-family="Arial" font-size="12">Conceptual target-state model · implementation and compliance require independent verification</text></svg>