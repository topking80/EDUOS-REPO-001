<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="t d"><title id="t">EduOS layered platform visualization</title><desc id="d">Four connected visual layers: experience workspaces, education services, shared data and governance, and infrastructure and observability.</desc><rect width="1200" height="500" rx="28" fill="#f2f6f8"/><text x="55" y="60" fill="#2a678d" font-family="Arial" font-size="17" font-weight="700" letter-spacing="3">EDUOS · PLATFORM LAYERS</text><text x="55" y="98" fill="#18344c" font-family="Arial" font-size="28" font-weight="700">One platform, layered responsibilities</text><g font-family="Arial"><g><rect x="70" y="140" width="1060" height="68" rx="14" fill="#17364f"/><text x="105" y="182" fill="#fff" font-size="21" font-weight="700">Experience layer</text><text x="420" y="182" fill="#d1e2eb" font-size="16">Superintendent · Principal · Teacher · Family · Pupil</text><g fill="#f1b15b"><circle cx="1040" cy="174" r="8"/><circle cx="1070" cy="174" r="8"/></g></g><g><rect x="110" y="222" width="1020" height="68" rx="14" fill="#286487"/><text x="145" y="264" fill="#fff" font-size="21" font-weight="700">Education services</text><text x="450" y="264" fill="#e0edf3" font-size="16">Learning · attendance · student support · communications</text></g><g><rect x="150" y="304" width="980" height="68" rx="14" fill="#5d91a8"/><text x="185" y="346" fill="#fff" font-size="21" font-weight="700">Shared records &amp; governance</text><text x="570" y="346" fill="#f0f6f8" font-size="16">Identity · policy · audit · data boundaries</text></g><g><rect x="190" y="386" width="940" height="68" rx="14" fill="#d5e6e9" stroke="#8fb3c0"/><text x="225" y="428" fill="#17364f" font-size="21" font-weight="700">Infrastructure &amp; observability</text><text x="620" y="428" fill="#416478" font-size="16">Campus edge · platform operations · monitoring</text></g></g><text x="600" y="480" fill="#647f90" font-family="Arial" font-size="12" text-anchor="middle">Conceptual architecture view · validate actual service boundaries against deployed configuration</text></svg>