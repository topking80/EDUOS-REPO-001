<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
<title id="title">EduOS operating model and agent roles</title>
<desc id="desc">A conceptual visual map based on the EduOS project architecture: state education department, district control plane, school and building edge, and five role workspaces. Christie AI coordinates the four named demonstration roles; Helios represents infrastructure, Vulcan platform operations, and Aurora observability. Lines show conceptual relationships, not live integrations.</desc>
<defs>
 <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#eaf1f8"/></linearGradient>
 <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f5f8fc"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#233c58" flood-opacity=".10"/></filter>
 <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#7890a8" stroke-width="1.5"/></marker>
</defs>
<rect width="1440" height="760" rx="30" fill="url(#canvas)"/>
<g opacity=".32" stroke="#b9c9d9" stroke-width="1"><path d="M48 110H1392M48 650H1392" stroke-dasharray="3 10"/><path d="M90 45V710M1350 45V710" stroke-dasharray="3 10"/></g>
<text x="72" y="70" fill="#19385c" font-family="Arial,sans-serif" font-size="27" font-weight="700">EDUOS · DISTRICT OPERATING MODEL</text>
<text x="72" y="101" fill="#62778d" font-family="Arial,sans-serif" font-size="15">Project architecture + defined demonstration agent responsibilities</text>
<!-- architecture spine -->
<g filter="url(#shadow)">
 <rect x="72" y="145" width="300" height="88" rx="16" fill="#c94343"/>
 <rect x="72" y="252" width="300" height="112" rx="16" fill="#e77832"/>
 <rect x="72" y="383" width="300" height="112" rx="16" fill="#55ad82"/>
 <rect x="72" y="514" width="300" height="88" rx="16" fill="#4d94d5"/>
</g>
<g font-family="Arial,sans-serif" text-anchor="middle" fill="#fff">
 <text x="222" y="181" font-size="18" font-weight="700">STATE EDUCATION</text><text x="222" y="204" font-size="18" font-weight="700">DEPARTMENT</text>
 <text x="222" y="298" font-size="19" font-weight="700">DISTRICT CONTROL PLANE</text><text x="222" y="326" font-size="14">Fleet · policy · aggregation</text>
 <text x="222" y="428" font-size="19" font-weight="700">SCHOOL / BUILDING EDGE</text><text x="222" y="456" font-size="14">Classroom hubs · local cache · offline</text>
 <text x="222" y="551" font-size="18" font-weight="700">ROLE WORKSPACES</text><text x="222" y="576" font-size="14">Superintendent · Principal · Teacher · Family · Pupil</text>
</g>
<g fill="none" stroke="#7890a8" stroke-width="3" marker-end="url(#arrow)"><path d="M222 234V247"/><path d="M222 365V378"/><path d="M222 496V509"/></g>
<!-- role map -->
<g filter="url(#shadow)"><rect x="430" y="145" width="938" height="457" rx="24" fill="url(#panel)" stroke="#d8e3ee"/></g>
<text x="470" y="188" fill="#19385c" font-family="Arial,sans-serif" font-size="21" font-weight="700">INTELLIGENCE &amp; OPERATIONS ROLES</text>
<text x="470" y="214" fill="#71849a" font-family="Arial,sans-serif" font-size="13">Conceptual role alignment to the shared district platform</text>
<!-- Christie hub -->
<g filter="url(#shadow)"><rect x="760" y="255" width="290" height="112" rx="20" fill="#eaf3fb" stroke="#2878bd" stroke-width="2"/></g>
<circle cx="815" cy="311" r="31" fill="#2878bd" opacity=".12"/><path d="M815 285L825 307L847 317L825 325L815 347L805 325L783 317L805 307Z" fill="none" stroke="#2878bd" stroke-width="4" stroke-linejoin="round"/>
<text x="860" y="300" fill="#1e4f7b" font-family="Arial,sans-serif" font-size="21" font-weight="700">CHRISTIE AI</text><text x="860" y="326" fill="#516d88" font-family="Arial,sans-serif" font-size="14">Universal Intelligence Interface</text>
<!-- specialists -->
<g filter="url(#shadow)">
 <rect x="475" y="430" width="245" height="116" rx="18" fill="#fff" stroke="#d6a447" stroke-width="2"/>
 <rect x="775" y="430" width="245" height="116" rx="18" fill="#fff" stroke="#b65b43" stroke-width="2"/>
 <rect x="1075" y="430" width="245" height="116" rx="18" fill="#fff" stroke="#388b80" stroke-width="2"/>
</g>
<g font-family="Arial,sans-serif">
 <circle cx="520" cy="475" r="20" fill="#d6a447" opacity=".16"/><path d="M510 475H530M520 465V485" stroke="#b58a2c" stroke-width="3"/><text x="552" y="472" fill="#805f1d" font-size="18" font-weight="700">HELIOS</text><text x="552" y="498" fill="#62778d" font-size="13">AI Infrastructure</text>
 <circle cx="820" cy="475" r="20" fill="#b65b43" opacity=".16"/><path d="M810 465L830 485M830 465L810 485" stroke="#a64f3b" stroke-width="3"/><text x="852" y="472" fill="#884331" font-size="18" font-weight="700">VULCAN</text><text x="852" y="498" fill="#62778d" font-size="13">DevOps &amp; Platform Operations</text>
 <circle cx="1120" cy="475" r="20" fill="#388b80" opacity=".16"/><path d="M1105 475Q1112 460 1120 475T1135 475" fill="none" stroke="#388b80" stroke-width="3"/><text x="1152" y="472" fill="#286e66" font-size="18" font-weight="700">AURORA</text><text x="1152" y="498" fill="#62778d" font-size="13">Observability &amp; Monitoring</text>
</g>
<g fill="none" stroke="#91a7bc" stroke-width="2.5" stroke-dasharray="7 7"><path d="M905 369V400H597V425"/><path d="M905 400H897V425"/><path d="M905 400H1197V425"/><path d="M372 308H420V311H755"/><path d="M372 439H420V488H470"/></g>
<text x="470" y="575" fill="#75899d" font-family="Arial,sans-serif" font-size="12">Dashed links indicate conceptual responsibility only; they do not represent deployed integrations or data flows.</text>
<!-- footer -->
<rect x="72" y="652" width="1296" height="58" rx="14" fill="#e1eaf3" stroke="#cfdae6"/>
<text x="100" y="687" fill="#35516e" font-family="Arial,sans-serif" font-size="15" font-weight="700">PROJECT VISUAL LANGUAGE</text>
<g font-family="Arial,sans-serif" font-size="13" fill="#536a81"><circle cx="340" cy="681" r="7" fill="#c94343"/><text x="356" y="686">State</text><circle cx="445" cy="681" r="7" fill="#e77832"/><text x="461" y="686">District</text><circle cx="555" cy="681" r="7" fill="#55ad82"/><text x="571" y="686">School edge</text><circle cx="705" cy="681" r="7" fill="#4d94d5"/><text x="721" y="686">Workspaces</text><text x="900" y="686" fill="#75899d">Illustrative reference · not a live topology</text></g>
</svg>