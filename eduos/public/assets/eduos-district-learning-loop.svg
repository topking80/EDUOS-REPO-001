<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">EduOS district-to-classroom operating loop</title><desc id="d">Conceptual workflow linking district priorities, school planning, classroom learning, student support and district review.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10243b"/><stop offset="1" stop-color="#1e4262"/></linearGradient><linearGradient id="ln"><stop stop-color="#f0a34a"/><stop offset="1" stop-color="#65b6d5"/></linearGradient></defs><rect width="1200" height="520" rx="28" fill="url(#bg)"/><g opacity=".13" stroke="#c5e4f5"><path d="M0 100H1200M0 200H1200M0 300H1200M0 400H1200M150 0V520M300 0V520M450 0V520M600 0V520M750 0V520M900 0V520M1050 0V520"/></g><text x="55" y="62" fill="#f4b45e" font-family="Arial" font-size="17" font-weight="700" letter-spacing="3">EDUOS · OPERATING LOOP</text><text x="55" y="102" fill="#fff" font-family="Arial" font-size="28" font-weight="700">From district priorities to learner outcomes</text><path d="M185 245H1010" stroke="url(#ln)" stroke-width="5"/><path d="M990 230l22 15-22 15" fill="none" stroke="#65b6d5" stroke-width="5"/><g font-family="Arial" text-anchor="middle"><g><rect x="45" y="165" width="205" height="160" rx="18" fill="#203d59" stroke="#eaa04c" stroke-width="2"/><circle cx="147" cy="207" r="22" fill="#eaa04c"/><text x="147" y="260" fill="#fff" font-size="18" font-weight="700">District priorities</text><text x="147" y="286" fill="#bfd0df" font-size="13">Goals · resources · policy</text></g><g><rect x="285" y="165" width="205" height="160" rx="18" fill="#203d59" stroke="#67b4d1" stroke-width="2"/><circle cx="387" cy="207" r="22" fill="#67b4d1"/><text x="387" y="260" fill="#fff" font-size="18" font-weight="700">School planning</text><text x="387" y="286" fill="#bfd0df" font-size="13">People · buildings · services</text></g><g><rect x="525" y="165" width="205" height="160" rx="18" fill="#203d59" stroke="#9dbd87" stroke-width