<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="t d"><title id="t">EduOS learning and support signal flow</title><desc id="d">Layered pathway from teacher planning to learner activity, evidence, student support and family communication with feedback to instruction.</desc><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#112c45"/><stop offset="1" stop-color="#235a77"/></linearGradient></defs><rect width="1200" height="500" rx="28" fill="url(#b)"/><text x="55" y="60" fill="#f1b45f" font-family="Arial" font-size="17" font-weight="700" letter-spacing="3">EDUOS · LEARNING SIGNALS</text><text x="55" y="98" fill="#fff" font-family="Arial" font-size="28" font-weight="700">Learning evidence becomes coordinated support</text><g fill="none" stroke-width="4" stroke-linecap="round"><path d="M225 235H335M455 235H565M685 235H795M915 235H1025" stroke="#78bed0"/><path d="M1000 220l25 15-25 15" stroke="#78bed0"/><path d="M1080 300V365H165V300" stroke="#e9aa55" stroke-dasharray="9 8"/></g><g font-family="Arial" text-anchor="middle"><g><rect x="65" y="165" width="160" height="140" rx="18" fill="#e7eff2"/><circle cx="145" cy="205" r="20" fill="#e9aa55"/><text x="145" y="260" fill="#183b54" font-size="18" font-weight="700">Plan</text><text x="145" y="282" fill="#557083" font-size="13">Teacher</text></g><g><rect x="335" y="165" width="160" height="140" rx="18" fill="#e7eff2"/><circle cx="415" cy="205" r="20" fill="#79b9ca"/><text x="415" y="260" fill="#183b54" font-size="18" font-weight="700">Learn</text><text x="415" y="282" fill="#557083" font-size="13">Pupil</text></g><g><rect x="565" y="165" width="160" height="140" rx="18" fill="#e7eff2"/><circle cx="645" cy="205" r="20" fill="#9dbc8e"/><text x="645" y="260" fill="#183b54" font-size="18" font-weight="700">Evidence</text><text x="645" y="282" fill="#557083" font-size="13">Progress &amp; feedback</text></g><g><rect x="795" y="165" width="160" height="140" rx="18" fill="#e7eff2"/><circle cx="875" cy="205" r="20" fill="#c7a0cb"/><text x="875" y="260" fill="#183b54" font-size="18" font-weight="700">Support</text><text x="875" y="282" fill="#557083" font-size="13">Intervention</text></g><g><rect x="1025" y="165" width="120" height="140" rx="18" fill="#e7eff2"/><circle cx="1085" cy="205" r="20" fill="#e9aa55"/><text x="1085" y="260" fill="#183b54" font-size="17" font-weight="700">Connect</text><text x="1085" y="282" fill="#557083" font-size="12">Family</text></g></g><text x="600" y="405" fill="#fff" font-family="Arial" font-size="18" text-anchor="middle" font-weight="700">Feedback informs the next instructional cycle</text><text x="600" y="445" fill="#b9d1df" font-family="Arial" font-size="13" text-anchor="middle">Conceptual workflow · examples do not imply automated decisions or live integrations</text></svg>