<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d"><title id="t">Classroom accessibility and readiness considerations</title><desc id="d">Four visual planning cards for clear circulation, accessible workspace, visible classroom information and verified emergency documentation.</desc><rect width="900" height="400" rx="24" fill="#f4f8fb"/><g font-family="Arial"><g transform="translate(30 36)"><rect width="198" height="310" rx="18" fill="#fff" stroke="#b8cbd9" stroke-width="2"/><rect x="52" y="36" width="94" height="100" rx="12" fill="#e1f0f8"/><path d="M68 116V56h62v60M98 56v60" fill="none" stroke="#5485a6" stroke-width="6"/><text x="99" y="180" text-anchor="middle" font-size="17" font-weight="700" fill="#315d7d">CLEAR PATHS</text><text x="99" y="208" text-anchor="middle" font-size="13" fill="#60778a">Keep circulation</text><text x="99" y="228" text-anchor="middle" font-size="13" fill="#60778a">areas unobstructed</text></g><g transform="translate(250 36)"><rect width="198" height="310" rx="18" fill="#fff" stroke="#b8cbd9" stroke-width="2"/><circle cx="99" cy="82" r="42" fill="#e3f3ea"/><circle cx="99" cy="68" r="12" fill="#4d9473"/><path d="M99 82v42m-23-20h46m-23 20-18 18m18-18 18 18" stroke="#4d9473" stroke-width="7" stroke-linecap="round"/><text x="99" y="180" text-anchor="middle" font-size="17" font-weight="700" fill="#28684d">ACCESSIBLE SETUP</text><text x="99" y="208" text-anchor="middle" font-size="13" fill="#60778a">Review reach, turning</text><text x="99" y="228" text-anchor="middle" font-size="13" fill="#60778a">space and seating</text></g><g transform="translate(470 36)"><rect width="198" height="310" rx="18" fill="#fff" stroke="#b8cbd9" stroke-width="2"/><rect x="48" y="40" width="102" height="90" rx="8" fill="#eee8fb" stroke="#9684c0" stroke-width="3"/><path d="M64 62h70m-70 18h58m-58 18h64" stroke="#8876b4" stroke-width="5"/><text x="99" y="180" text-anchor="middle" font-size="17" font-weight="700" fill="#594b83">VISIBLE INFO</text><text x="99" y="208" text-anchor="middle" font-size="13" fill="#60778a">Display room labels</text><text x="99" y="228" text-anchor="middle" font-size="13" fill="#60778a">and class routines</text></g><g transform="translate(690 36)"><rect width="180" height="310" rx="18" fill="#fff" stroke="#b8cbd9" stroke-width="2"/><path d="M90 36l48 18v38c0 34-20 52-48 66-28-14-48-32-48-66V54z" fill="#fff0e7" stroke="#d58b58" stroke-width="4"/><path d="M90 62v48m0 14v3" stroke="#b66b39" stroke-width="7" stroke-linecap="round"/><text x="90" y="180" text-anchor="middle" font-size="16" font-weight="700" fill="#9a5830">SAFETY PLAN</text><text x="90" y="208" text-anchor="middle" font-size="13" fill="#60778a">Use approved school</text><text x="90" y="228" text-anchor="middle" font-size="13" fill="#60778a">emergency documents</text></g></g></svg>