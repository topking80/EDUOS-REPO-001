          eduos:slo_availability_bad_ratio:rate1d > 0.003
          and eduos:slo_availability_bad_ratio:rate2h > 0.003
          and eduos:slo_availability_requests:rate1d > 0.01
        for: 1h
        labels:
          severity: warning
          service: eduos
          slo: availability
          window: 1d
        annotations:
          summary: "EduOS requests succeed SLO: error budget burning 3x"
          description: "Over the last 1d and 2h, more than 0.3% of requests were bad (objective 99.9%). At this rate the service spends 10% of the 30-day error budget in a day. Check recent deploys, eduos_http_requests_total by route, the database pool and dependencies."
          runbook: "docs/SLOS.md"
      - alert: EduOSAvailabilityBudgetBurnCreeping
        expr: |
          eduos:slo_availability_bad_ratio:rate3d > 0.001
          and eduos:slo_availability_bad_ratio:rate6h > 0.001
          and eduos:slo_availability_requests:rate3d > 0.01
