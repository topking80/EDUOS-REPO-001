      - record: eduos:slo_latency_bad_ratio:rate30m
        expr: "eduos:slo_latency_bad:rate30m / clamp_min(eduos:slo_latency_requests:rate30m, 1e-9)"
      - record: eduos:slo_latency_requests:rate1h
        expr: "sum(rate(eduos_http_request_duration_seconds_count{job=\"eduos\",route!~\"/metrics|/health|/api/operations/stream|/api/ai/run|/api/christie/sessions/:id/turns|/api/edison/brief|/api/leo/drafts\"}[1h]))"
      - record: eduos:slo_latency_bad:rate1h
        expr: "sum(rate(eduos_http_request_duration_seconds_count{job=\"eduos\",route!~\"/metrics|/health|/api/operations/stream|/api/ai/run|/api/christie/sessions/:id/turns|/api/edison/brief|/api/leo/drafts\"}[1h])) - sum(rate(eduos_http_request_duration_seconds_bucket{job=\"eduos\",route!~\"/metrics|/health|/api/operations/stream|/api/ai/run|/api/christie/sessions/:id/turns|/api/edison/brief|/api/leo/drafts\",le=\"1\"}[1h]))"
      - record: eduos:slo_latency_bad_ratio:rate1h
        expr: "eduos:slo_latency_bad:rate1h / clamp_min(eduos:slo_latency_requests:rate1h, 1e-9)"
      - record: eduos:slo_latency_requests:rate2h
        expr: "sum(rate(eduos_http_request_duration_seconds_count{job=\"eduos\",route!~\"/metrics|/health|/api/operations/stream|/api/ai/run|/api/christie/sessions/:id/turns|/api/edison/brief|/api/leo/drafts\"}[2h]))"
      - record: eduos:slo_latency_bad:rate2h
        expr: "sum(rate(eduos_http_request_duration_seconds_count{job=\"eduos\",route!~\"/metrics|/health|/api/operations/stream|/api/ai/run|/api/christie/sessions/:id/turns|/api/edison/brief|/api/leo/drafts\"}[2h])) - sum(rate(eduos_http_request_duration_seconds_bucket{job=\"eduos\",route!~\"/metrics|/health|/api/operations/stream|/api/ai/run|/api/christie/sessions/:id/turns|/api/edison/brief|/api/leo/drafts\",le=\"1\"}[2h]))"
      - record: eduos:slo_latency_bad_ratio:rate2h
        expr: "eduos:slo_latency_bad:rate2h / clamp_min(eduos:slo_latency_requests:rate2h, 1e-9)"
      - record: eduos:slo_latency_requests:rate6h
        expr: "sum(rate(eduos_http_request_duration_seconds_count{job=\"eduos\",route!~\"/metrics|/health|/api/operations/stream|/api/ai/run|/api/christie/sessions/:id/turns|/api/edison/brief|/api/leo/drafts\"}[6h]))"
      - record: eduos:slo_latency_bad:rate6h
        expr: "sum(rate(eduos_http_request_duration_seconds_count{job=\"eduos\",route!~\"/metrics|/health|/api/operations/stream|/api/ai/run|/api/christie/sessions/:id/turns|/api/edison/brief|/api/leo/drafts\"}[6h])) - sum(rate(eduos_http_request_duration_seconds_bucket{job=\"eduos\",route!~\"/metrics|/health|/api/operations/stream|/api/ai/run|/api/christie/sessions/:id/turns|/api/edison/brief|/api/leo/drafts\",le=\"1\"}[6h]))"
      - record: eduos:slo_latency_bad_ratio:rate6h
        expr: "eduos:slo_latency_bad:rate6h / clamp_min(eduos:slo_latency_requests:rate6h, 1e-9)"
