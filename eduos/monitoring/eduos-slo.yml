          service: eduos
          slo: latency
          window: 3d
        annotations:
          summary: "EduOS requests answered within 1s SLO: error budget burning 1x"
          description: "Over the last 3d and 6h, more than 1% of requests were bad (objective 99%). At this rate the service spends the 30-day error budget at the rate it is being earned. Check recent deploys, eduos_http_requests_total by route, the database pool and dependencies."
          runbook: "docs/SLOS.md"
      - alert: EduOSUptimeBudgetExhausted
        expr: eduos:slo_uptime_bad_ratio:rate30d > 0.001000
        for: 10m
        labels:
          severity: warning
          service: eduos
          slo: uptime
          window: 30d
        annotations:
          summary: "EduOS uptime is below its 99.9% objective for the last 30 days"
          description: "The 30-day uptime error budget is spent. Outages page through EduOSScrapeUnavailable; this alert is for planning: hold risky changes until the budget recovers (docs/SLOS.md)."
          runbook: "docs/SLOS.md"
