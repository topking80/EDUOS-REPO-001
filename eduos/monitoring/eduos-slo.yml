      - alert: EduOSLatencyBudgetBurnSlow
        expr: |
          eduos:slo_latency_bad_ratio:rate1d > 0.03
          and eduos:slo_latency_bad_ratio:rate2h > 0.03
          and eduos:slo_latency_requests:rate1d > 0.01
        for: 1h
        labels:
          severity: warning
          service: eduos
          slo: latency
          window: 1d
        annotations:
          summary: "EduOS requests answered within 1s SLO: error budget burning 3x"
          description: "Over the last 1d and 2h, more than 3% of requests were bad (objective 99%). At this rate the service spends 10% of the 30-day error budget in a day. Check recent deploys, eduos_http_requests_total by route, the database pool and dependencies."
          runbook: "docs/SLOS.md"
      - alert: EduOSLatencyBudgetBurnCreeping
        expr: |
          eduos:slo_latency_bad_ratio:rate3d > 0.01
          and eduos:slo_latency_bad_ratio:rate6h > 0.01
