# GENERATED by scripts/generate-slo-rules.mjs from src/slo.js. Do not edit by hand.
# EduOS service level objectives (CMP-05): SLI recording rules, error budgets
# and multi-window burn-rate alerts. Runbook: docs/SLOS.md
# Needs Prometheus retention of at least 30 days for the budget series.
groups:
  - name: eduos.slo.availability.recording
    interval: 1m
    rules:
      - record: eduos:slo_availability_requests:rate5m
        expr: "sum(rate(eduos_http_requests_total{job=\"eduos\",route!~\"/metrics|/health|/api/operations/stream\"}[5m]))"
      - record: eduos:slo_availability_bad:rate5m
        expr: "sum(rate(eduos_http_requests_total{job=\"eduos\",route!~\"/metrics|/health|/api/operations/stream\",status=\"5xx\"}[5m]))"
      - record: eduos:slo_availability_bad_ratio:rate5m
        expr: "eduos:slo_availability_bad:rate5m / clamp_min(eduos:slo_availability_requests:rate5m, 1e-9)"
      - record: eduos:slo_availability_requests:rate30m
        expr: "sum(rate(eduos_http_requests_total{job=\"eduos\",route!~\"/metrics|/health|/api/operations/stream\"}[30m]))"
      - record: eduos:slo_availability_bad:rate30m
        expr: "sum(rate(eduos_http_requests_total{job=\"eduos\",route!~\"/metrics|/health|/api/operations/stream\",status=\"5xx\"}[30m]))"
      - record: eduos:slo_availability_bad_ratio:rate30m
        expr: "eduos:slo_availability_bad:rate30m / clamp_min(eduos:slo_availability_requests:rate30m, 1e-9)"
      - record: eduos:slo_availability_requests:rate1h
        expr: "sum(rate(eduos_http_requests_total{job=\"eduos\",route!~\"/metrics|/health|/api/operations/stream\"}[1h]))"
      - record: eduos:slo_availability_bad:rate1h
        expr: "sum(rate(eduos_http_requests_total{job=\"eduos\",route!~\"/metrics|/health|/api/operations/stream\",status=\"5xx\"}[1h]))"
      - record: eduos:slo_availability_bad_ratio:rate1h
        expr: "eduos:slo_availability_bad:rate1h / clamp_min(eduos:slo_availability_requests:rate1h, 1e-9)"
      - record: eduos:slo_availability_requests:rate2h
        expr: "sum(rate(eduos_http_requests_total{job=\"eduos\",route!~\"/metrics|/health|/api/operations/stream\"}[2h]))"
      - record: eduos:slo_availability_bad:rate2h
        expr: "sum(rate(eduos_http_requests_total{job=\"eduos\",route!~\"/metrics|/health|/api/operations/stream\",status=\"5xx\"}[2h]))"
      - record: eduos:slo_availability_bad_ratio:rate2h
        expr: "eduos:slo_availability_bad:rate2h / clamp_min(eduos:slo_availability_requests:rate2h, 1e-9)"
      - record: eduos:slo_availability_requests:rate6h
        expr: "sum(rate(eduos_http_requests_total{job=\"eduos\",route!~\"/metrics|/health|/api/operations/stream\"}[6h]))"
      - record: eduos:slo_availability_bad:rate6h
        expr: "sum(rate(eduos_http_requests_total{job=\"eduos\",route!~\"/metrics|/health|/api/operations/stream\",status=\"5xx\"}[6h]))"
      - record: eduos:slo_availability_bad_ratio:rate6h
        expr: "eduos:slo_availability_bad:rate6h / clamp_min(eduos:slo_availability_requests:rate6h, 1e-9)"
      - record: eduos:slo_availability_requests:rate1d
        expr: "avg_over_time(eduos:slo_availability_requests:rate5m[1d])"
      - record: eduos:slo_availability_bad_ratio:rate1d
        expr: "sum_over_time(eduos:slo_availability_bad:rate5m[1d]) / clamp_min(sum_over_time(eduos:slo_availability_requests:rate5m[1d]), 1e-9)"
      - record: eduos:slo_availability_requests:rate3d
        expr: "avg_over_time(eduos:slo_availability_requests:rate5m[3d])"
      - record: eduos:slo_availability_bad_ratio:rate3d
        expr: "sum_over_time(eduos:slo_availability_bad:rate5m[3d]) / clamp_min(sum_over_time(eduos:slo_availability_requests:rate5m[3d]), 1e-9)"
      - record: eduos:slo_availability_requests:rate30d
        expr: "avg_over_time(eduos:slo_availability_requests:rate5m[30d])"
      - record: eduos:slo_availability_bad_ratio:rate30d
        expr: "sum_over_time(eduos:slo_availability_bad:rate5m[30d]) / clamp_min(sum_over_time(eduos:slo_availability_requests:rate5m[30d]), 1e-9)"
      - record: eduos:slo_error_budget_remaining:ratio
        expr: "1 - eduos:slo_availability_bad_ratio:rate30d / 0.001000"
        labels:
          slo: availability
      - record: eduos:slo_objective:ratio
        expr: vector(0.999)
        labels:
          slo: availability
  - name: eduos.slo.latency.recording
    interval: 1m
    rules:
      - record: eduos:slo_latency_requests:rate5m
