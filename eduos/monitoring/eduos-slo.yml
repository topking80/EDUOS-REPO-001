      - record: eduos:slo_latency_bad:rate5m
        expr: "sum(rate(eduos_http_request_duration_seconds_count{job=\"eduos\",route!~\"/metrics|/health|/api/operations/stream|/api/ai/run|/api/christie/sessions/:id/turns|/api/edison/brief|/api/leo/drafts\"}[5m])) - sum(rate(eduos_http_request_duration_seconds_bucket{job=\"eduos\",route!~\"/metrics|/health|/api/operations/stream|/api/ai/run|/api/christie/sessions/:id/turns|/api/edison/brief|/api/leo/drafts\",le=\"1\"}[5m]))"
      - record: eduos:slo_latency_bad_ratio:rate5m
