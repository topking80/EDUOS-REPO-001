          description: "Over the last 3d and 6h, more than 0.1% of requests were bad (objective 99.9%). At this rate the service spends the 30-day error budget at the rate it is being earned. Check recent deploys, eduos_http_requests_total by route, the database pool and dependencies."
          runbook: "docs/SLOS.md"
      - alert: EduOSLatencyBudgetBurnFast
        expr: |
          eduos:slo_latency_bad_ratio:rate1h > 0.144
          and eduos:slo_latency_bad_ratio:rate5m > 0.144
          and eduos:slo_latency_requests:rate1h > 0.01
        for: 2m
        labels:
          severity: critical
          service: eduos
          slo: latency
          window: 1h
        annotations:
          summary: "EduOS requests answered within 1s SLO: error budget burning 14.4x"
          description: "Over the last 1h and 5m, more than 14.4% of requests were bad (objective 99%). At this rate the service spends 2% of the 30-day error budget in an hour. Check recent deploys, eduos_http_requests_total by route, the database pool and dependencies."
          runbook: "docs/SLOS.md"
      - alert: EduOSLatencyBudgetBurnSteady
        expr: |
          eduos:slo_latency_bad_ratio:rate6h > 0.06
          and eduos:slo_latency_bad_ratio:rate30m > 0.06
          and eduos:slo_latency_requests:rate6h > 0.01
        for: 15m
        labels:
          severity: critical
          service: eduos
          slo: latency
          window: 6h
