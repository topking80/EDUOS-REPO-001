      - record: eduos:slo_latency_bad_ratio:rate1d
        expr: "sum_over_time(eduos:slo_latency_bad:rate5m[1d]) / clamp_min(sum_over_time(eduos:slo_latency_requests:rate5m[1d]), 1e-9)"
      - record: eduos:slo_latency_requests:rate3d
        expr: "avg_over_time(eduos:slo_latency_requests:rate5m[3d])"
      - record: eduos:slo_latency_bad_ratio:rate3d
