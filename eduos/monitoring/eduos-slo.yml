  - name: eduos.slo.uptime.recording
    interval: 1m
    rules:
      - record: eduos:slo_uptime_up:max
        expr: "max(up{job=\"eduos\"}) or vector(0)"
      - record: eduos:slo_uptime_bad_ratio:rate1h
        expr: "1 - avg_over_time(eduos:slo_uptime_up:max[1h])"
      - record: eduos:slo_uptime_bad_ratio:rate1d
        expr: "1 - avg_over_time(eduos:slo_uptime_up:max[1d])"
      - record: eduos:slo_uptime_bad_ratio:rate30d
        expr: "1 - avg_over_time(eduos:slo_uptime_up:max[30d])"
      - record: eduos:slo_error_budget_remaining:ratio
        expr: "1 - eduos:slo_uptime_bad_ratio:rate30d / 0.001000"
        labels:
          slo: uptime
      - record: eduos:slo_objective:ratio
        expr: vector(0.999)
        labels:
          slo: uptime
  - name: eduos.slo.alerts
    rules:
      - alert: EduOSAvailabilityBudgetBurnFast
        expr: |
          eduos:slo_availability_bad_ratio:rate1h > 0.0144
          and eduos:slo_availability_bad_ratio:rate5m > 0.0144
          and eduos:slo_availability_requests:rate1h > 0.01
        for: 2m
        labels:
          severity: critical
          service: eduos
          slo: availability
          window: 1h
        annotations:
          summary: "EduOS requests succeed SLO: error budget burning 14.4x"
          description: "Over the last 1h and 5m, more than 1.44% of requests were bad (objective 99.9%). At this rate the service spends 2% of the 30-day error budget in an hour. Check recent deploys, eduos_http_requests_total by route, the database pool and dependencies."
          runbook: "docs/SLOS.md"
      - alert: EduOSAvailabilityBudgetBurnSteady
        expr: |
          eduos:slo_availability_bad_ratio:rate6h > 0.006
          and eduos:slo_availability_bad_ratio:rate30m > 0.006
          and eduos:slo_availability_requests:rate6h > 0.01
        for: 15m
        labels:
          severity: critical
          service: eduos
          slo: availability
          window: 6h
        annotations:
          summary: "EduOS requests succeed SLO: error budget burning 6x"
          description: "Over the last 6h and 30m, more than 0.6% of requests were bad (objective 99.9%). At this rate the service spends 5% of the 30-day error budget in six hours. Check recent deploys, eduos_http_requests_total by route, the database pool and dependencies."
