# GENERATED by scripts/generate-slo-rules.mjs. Run: promtool test rules monitoring/eduos-slo.test.yml
rule_files:
  - eduos-slo.yml
evaluation_interval: 1m
tests:
  # Healthy: no alerts, full budget; monitoring routes are excluded
  - interval: 1m
    input_series:
      - series: "eduos_http_requests_total{job=\"eduos\",method=\"GET\",route=\"/api/home\",instance=\"a\",status=\"2xx\"}"
        values: "0+600x120"
      - series: "eduos_http_requests_total{job=\"eduos\",method=\"GET\",route=\"/api/home\",instance=\"a\",status=\"5xx\"}"
        values: "0+0x120"
      - series: "eduos_http_request_duration_seconds_count{job=\"eduos\",method=\"GET\",route=\"/api/home\",instance=\"a\",status=\"2xx\"}"
        values: "0+600x120"
      - series: "eduos_http_request_duration_seconds_bucket{job=\"eduos\",method=\"GET\",route=\"/api/home\",instance=\"a\",status=\"2xx\",le=\"1\"}"
        values: "0+600x120"
      - series: "up{job=\"eduos\",instance=\"a\"}"
        values: "1x120"
      - series: "eduos_http_requests_total{job=\"eduos\",method=\"GET\",route=\"/metrics\",instance=\"a\",status=\"5xx\"}"
        values: "0+600x120"
    alert_rule_test:
      - eval_time: 100m
        alertname: EduOSAvailabilityBudgetBurnFast
        exp_alerts: []
      - eval_time: 100m
        alertname: EduOSAvailabilityBudgetBurnSteady
        exp_alerts: []
      - eval_time: 100m
        alertname: EduOSAvailabilityBudgetBurnSlow
        exp_alerts: []
      - eval_time: 100m
        alertname: EduOSAvailabilityBudgetBurnCreeping
        exp_alerts: []
      - eval_time: 100m
        alertname: EduOSLatencyBudgetBurnFast
        exp_alerts: []
      - eval_time: 100m
        alertname: EduOSLatencyBudgetBurnSteady
        exp_alerts: []
      - eval_time: 100m
        alertname: EduOSLatencyBudgetBurnSlow
        exp_alerts: []
      - eval_time: 100m
        alertname: EduOSLatencyBudgetBurnCreeping
        exp_alerts: []
      - eval_time: 100m
        alertname: EduOSUptimeBudgetExhausted
        exp_alerts: []
    promql_expr_test:
      - expr: "eduos:slo_error_budget_remaining:ratio{slo=\"availability\"}"
        eval_time: 100m
        exp_samples:
          - labels: "eduos:slo_error_budget_remaining:ratio{slo=\"availability\"}"
            value: 1
      - expr: "eduos:slo_error_budget_remaining:ratio{slo=\"uptime\"}"
        eval_time: 100m
        exp_samples:
          - labels: "eduos:slo_error_budget_remaining:ratio{slo=\"uptime\"}"
            value: 1
  # Outage: 10% server errors
  - interval: 1m
    input_series:
      - series: "eduos_http_requests_total{job=\"eduos\",method=\"GET\",route=\"/api/home\",instance=\"a\",status=\"2xx\"}"
        values: "0+540x120"
      - series: "eduos_http_requests_total{job=\"eduos\",method=\"GET\",route=\"/api/home\",instance=\"a\",status=\"5xx\"}"
        values: "0+60x120"
      - series: "eduos_http_request_duration_seconds_count{job=\"eduos\",method=\"GET\",route=\"/api/home\",instance=\"a\",status=\"2xx\"}"
        values: "0+600x120"
      - series: "eduos_http_request_duration_seconds_bucket{job=\"eduos\",method=\"GET\",route=\"/api/home\",instance=\"a\",status=\"2xx\",le=\"1\"}"
        values: "0+600x120"
      - series: "up{job=\"eduos\",instance=\"a\"}"
        values: "1x120"
    alert_rule_test:
      - eval_time: 30m
        alertname: EduOSAvailabilityBudgetBurnFast
        exp_alerts:
          - exp_labels:
              severity: "critical"
              service: "eduos"
              slo: "availability"
              window: "1h"
            exp_annotations:
              summary: "EduOS requests succeed SLO: error budget burning 14.4x"
              description: "Over the last 1h and 5m, more than 1.44% of requests were bad (objective 99.9%). At this rate the service spends 2% of the 30-day error budget in an hour. Check recent deploys, eduos_http_requests_total by route, the database pool and dependencies."
              runbook: "docs/SLOS.md"
      - eval_time: 30m
        alertname: EduOSAvailabilityBudgetBurnSteady
        exp_alerts:
          - exp_labels:
              severity: "critical"
              service: "eduos"
              slo: "availability"
              window: "6h"
            exp_annotations:
              summary: "EduOS requests succeed SLO: error budget burning 6x"
              description: "Over the last 6h and 30m, more than 0.6% of requests were bad (objective 99.9%). At this rate the service spends 5% of the 30-day error budget in six hours. Check recent deploys, eduos_http_requests_total by route, the database pool and dependencies."
              runbook: "docs/SLOS.md"
      - eval_time: 30m
        alertname: EduOSAvailabilityBudgetBurnSlow
        exp_alerts: []
      - eval_time: 30m
        alertname: EduOSAvailabilityBudgetBurnCreeping
        exp_alerts: []
      - eval_time: 30m
        alertname: EduOSLatencyBudgetBurnFast
        exp_alerts: []
      - eval_time: 30m
        alertname: EduOSLatencyBudgetBurnSteady
        exp_alerts: []
      - eval_time: 30m
        alertname: EduOSLatencyBudgetBurnSlow
        exp_alerts: []
      - eval_time: 30m
        alertname: EduOSLatencyBudgetBurnCreeping
        exp_alerts: []
      - eval_time: 30m
        alertname: EduOSUptimeBudgetExhausted
        exp_alerts: []
    promql_expr_test:
      - expr: "eduos:slo_error_budget_remaining:ratio{slo=\"availability\"} < bool 0"
        eval_time: 30m
        exp_samples:
          - labels: "{slo=\"availability\"}"
            value: 1
  # Slow responses: half over 1s
  - interval: 1m
    input_series:
      - series: "eduos_http_requests_total{job=\"eduos\",method=\"GET\",route=\"/api/home\",instance=\"a\",status=\"2xx\"}"
        values: "0+600x120"
      - series: "eduos_http_requests_total{job=\"eduos\",method=\"GET\",route=\"/api/home\",instance=\"a\",status=\"5xx\"}"
        values: "0+0x120"
      - series: "eduos_http_request_duration_seconds_count{job=\"eduos\",method=\"GET\",route=\"/api/home\",instance=\"a\",status=\"2xx\"}"
        values: "0+600x120"
      - series: "eduos_http_request_duration_seconds_bucket{job=\"eduos\",method=\"GET\",route=\"/api/home\",instance=\"a\",status=\"2xx\",le=\"1\"}"
        values: "0+300x120"
      - series: "up{job=\"eduos\",instance=\"a\"}"
        values: "1x120"
    alert_rule_test:
      - eval_time: 30m
        alertname: EduOSAvailabilityBudgetBurnFast
        exp_alerts: []
      - eval_time: 30m
        alertname: EduOSAvailabilityBudgetBurnSteady
        exp_alerts: []
      - eval_time: 30m
        alertname: EduOSAvailabilityBudgetBurnSlow
        exp_alerts: []
      - eval_time: 30m
        alertname: EduOSAvailabilityBudgetBurnCreeping
        exp_alerts: []
      - eval_time: 30m
        alertname: EduOSLatencyBudgetBurnFast
        exp_alerts:
          - exp_labels:
              severity: "critical"
              service: "eduos"
              slo: "latency"
              window: "1h"
            exp_annotations:
              summary: "EduOS requests answered within 1s SLO: error budget burning 14.4x"
              description: "Over the last 1h and 5m, more than 14.4% of requests were bad (objective 99%). At this rate the service spends 2% of the 30-day error budget in an hour. Check recent deploys, eduos_http_requests_total by route, the database pool and dependencies."
              runbook: "docs/SLOS.md"
      - eval_time: 30m
        alertname: EduOSLatencyBudgetBurnSteady
        exp_alerts:
          - exp_labels:
              severity: "critical"
              service: "eduos"
              slo: "latency"
              window: "6h"
            exp_annotations:
              summary: "EduOS requests answered within 1s SLO: error budget burning 6x"
              description: "Over the last 6h and 30m, more than 6% of requests were bad (objective 99%). At this rate the service spends 5% of the 30-day error budget in six hours. Check recent deploys, eduos_http_requests_total by route, the database pool and dependencies."
              runbook: "docs/SLOS.md"
      - eval_time: 30m
        alertname: EduOSLatencyBudgetBurnSlow
        exp_alerts: []
      - eval_time: 30m
        alertname: EduOSLatencyBudgetBurnCreeping
        exp_alerts: []
      - eval_time: 30m
        alertname: EduOSUptimeBudgetExhausted
        exp_alerts: []
  # Quiet hours: a few failures among very few requests
  - interval: 1m
    input_series:
      - series: "eduos_http_requests_total{job=\"eduos\",method=\"GET\",route=\"/api/home\",instance=\"a\",status=\"2xx\"}"
        values: "0+0.15x120"
      - series: "eduos_http_requests_total{job=\"eduos\",method=\"GET\",route=\"/api/home\",instance=\"a\",status=\"5xx\"}"
        values: "0+0.15x120"
      - series: "eduos_http_request_duration_seconds_count{job=\"eduos\",method=\"GET\",route=\"/api/home\",instance=\"a\",status=\"2xx\"}"
        values: "0+0.3x120"
      - series: "eduos_http_request_duration_seconds_bucket{job=\"eduos\",method=\"GET\",route=\"/api/home\",instance=\"a\",status=\"2xx\",le=\"1\"}"
        values: "0+0.3x120"
      - series: "up{job=\"eduos\",instance=\"a\"}"
        values: "1x120"
    alert_rule_test:
      - eval_time: 30m
        alertname: EduOSAvailabilityBudgetBurnFast
        exp_alerts: []
      - eval_time: 30m
        alertname: EduOSAvailabilityBudgetBurnSteady
        exp_alerts: []
      - eval_time: 30m
        alertname: EduOSAvailabilityBudgetBurnSlow
        exp_alerts: []
      - eval_time: 30m
        alertname: EduOSAvailabilityBudgetBurnCreeping
        exp_alerts: []
      - eval_time: 30m
        alertname: EduOSLatencyBudgetBurnFast
        exp_alerts: []
      - eval_time: 30m
        alertname: EduOSLatencyBudgetBurnSteady
        exp_alerts: []
      - eval_time: 30m
        alertname: EduOSLatencyBudgetBurnSlow
        exp_alerts: []
      - eval_time: 30m
        alertname: EduOSLatencyBudgetBurnCreeping
        exp_alerts: []
      - eval_time: 30m
        alertname: EduOSUptimeBudgetExhausted
        exp_alerts: []
  # Down for 15 minutes
  - interval: 1m
    input_series:
      - series: "eduos_http_requests_total{job=\"eduos\",method=\"GET\",route=\"/api/home\",instance=\"a\",status=\"2xx\"}"
        values: "0+600x120"
      - series: "eduos_http_requests_total{job=\"eduos\",method=\"GET\",route=\"/api/home\",instance=\"a\",status=\"5xx\"}"
        values: "0+0x120"
      - series: "eduos_http_request_duration_seconds_count{job=\"eduos\",method=\"GET\",route=\"/api/home\",instance=\"a\",status=\"2xx\"}"
        values: "0+600x120"
      - series: "eduos_http_request_duration_seconds_bucket{job=\"eduos\",method=\"GET\",route=\"/api/home\",instance=\"a\",status=\"2xx\",le=\"1\"}"
        values: "0+600x120"
      - series: "up{job=\"eduos\",instance=\"a\"}"
        values: "1x60 0x15 1x45"
    alert_rule_test:
      - eval_time: 110m
        alertname: EduOSAvailabilityBudgetBurnFast
        exp_alerts: []
      - eval_time: 110m
        alertname: EduOSAvailabilityBudgetBurnSteady
        exp_alerts: []
      - eval_time: 110m
        alertname: EduOSAvailabilityBudgetBurnSlow
        exp_alerts: []
      - eval_time: 110m
        alertname: EduOSAvailabilityBudgetBurnCreeping
        exp_alerts: []
      - eval_time: 110m
        alertname: EduOSLatencyBudgetBurnFast
        exp_alerts: []
      - eval_time: 110m
        alertname: EduOSLatencyBudgetBurnSteady
        exp_alerts: []
      - eval_time: 110m
        alertname: EduOSLatencyBudgetBurnSlow
        exp_alerts: []
      - eval_time: 110m
        alertname: EduOSLatencyBudgetBurnCreeping
        exp_alerts: []
      - eval_time: 110m
        alertname: EduOSUptimeBudgetExhausted
        exp_alerts:
          - exp_labels:
              severity: "warning"
              service: "eduos"
              slo: "uptime"
              window: "30d"
            exp_annotations:
              summary: "EduOS uptime is below its 99.9% objective for the last 30 days"
              description: "The 30-day uptime error budget is spent. Outages page through EduOSScrapeUnavailable; this alert is for planning: hold risky changes until the budget recovers (docs/SLOS.md)."
              runbook: "docs/SLOS.md"
