plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "org.eduos.eduos_mobile_branding"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        // flutter_web_auth_2 4+ needs Java 11.
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11
    }

    defaultConfig {
        // The sign-in redirect scheme org.eduos.app (NATIVE_APP_REDIRECT_URIS on
        // the server) matches this application ID.
        applicationId = "org.eduos.app"
        // flutter_secure_storage 10 (Android Keystore) needs API 23+.
        minSdk = 23
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // Districts sign release builds with their own key (see README).
            // Debug keys keep `flutter run --release` working locally.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
