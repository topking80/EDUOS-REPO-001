name: eduos_mobile_branding
publish_to: 'none'
description: EduOS mobile app (sign-in, parent app, offline queue) with the school branding and mascot.
version: 32.32.0+323200

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  rive: ^0.13.20
  flutter_svg: ^2.0.17
  http: ^1.6.0
  crypto: ^3.0.8
  flutter_secure_storage: ^9.2.2
  flutter_web_auth_2: ^4.0.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
