version: 2
updates:
  - package-ecosystem: npm
    directory: /eduos
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    open-pull-requests-limit: 5
    versioning-strategy: increase
    labels:
      - dependencies
      - security-review
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      production-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch

  # CI actions are pinned to full commit SHAs (test/ci-pinning.test.js); this
  # keeps them current, updating the SHA and its version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security-review
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns: ["*"]

