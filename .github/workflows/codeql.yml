name: CodeQL security analysis

on:
  pull_request:
    branches: [main]
    paths:
      - "eduos/**/*.js"
      - "eduos/**/*.mjs"
      - "eduos/**/*.cjs"
      - ".github/workflows/codeql.yml"
  push:
    branches: [main]
    paths:
      - "eduos/**/*.js"
      - "eduos/**/*.mjs"
      - "eduos/**/*.cjs"
      - ".github/workflows/codeql.yml"
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze JavaScript and TypeScript
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9418214df1f2c4b8128c770156c409013b07d6b9 # v3.39.3
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@9418214df1f2c4b8128c770156c409013b07d6b9 # v3.39.3

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@9418214df1f2c4b8128c770156c409013b07d6b9 # v3.39.3
        with:
          category: "/language:javascript-typescript"
