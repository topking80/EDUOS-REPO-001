# EduOS CI (32.1.0): unit tests, PostgreSQL integration tests, edge checks and a
# full-stack end-to-end smoke test (Docker Compose + Caddy + local dev IdP).
# Nothing here deploys anything or uses external credentials.
# Moved from eduos/.github/ to the repository root (GitHub only runs root
# workflows); paths adjusted for the eduos/ directory.
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read

# The EduOS project lives in eduos/ in this repository (37.4.0 import).
defaults:
  run:
    working-directory: eduos

jobs:
  prometheus-rules:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Validate Prometheus alert rules with promtool
        run: |
          docker run --rm --entrypoint=promtool \
            --volume "$PWD/monitoring:/etc/prometheus:ro" \
            prom/prometheus:v3.5.0 \
            check rules /etc/prometheus/eduos-alerts.yml /etc/prometheus/eduos-slo.yml /etc/prometheus/federation-alerts.yml
      # CMP-05: SLO rules, run against synthetic traffic (healthy, outage, slow,
      # quiet hours, unreachable); each case lists which alerts must fire.
      - name: Unit-test the SLO rules with promtool
        run: |
          docker run --rm --entrypoint=promtool \
            --volume "$PWD/monitoring:/etc/prometheus:ro" --workdir /etc/prometheus \
            prom/prometheus:v3.5.0 \
            test rules eduos-slo.test.yml federation-alerts.test.yml

  source-and-container-security:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Scan source, dependencies, and IaC configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: eduos
          # Path-scoped accepted risks (edge agents running as root); see the file.
          trivyignores: .trivyignore.yaml
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: '1'
      - name: Build production container image
        run: docker build --target app -t eduos-app:ci .
      - name: Scan production container image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: eduos-app:ci
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: '1'

  dependency-security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm, cache-dependency-path: eduos/package-lock.json }
      - name: Verify lockfile and package registry policy
        run: npm run verify:dependencies
      - name: Install from lockfile
        run: npm ci
      - name: Audit production and development dependency tree
        id: dependency-audit
        continue-on-error: true
        run: npm run audit:dependencies:report
      - name: Generate SPDX SBOM and license inventory
        run: npm run supply-chain:check
      - name: Generate release provenance record
        run: npm run supply-chain:provenance
      - name: Preserve SBOM and license evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-sbom-license-provenance
          path: eduos/artifacts/supply-chain/
          if-no-files-found: warn
          retention-days: 90
      - name: Preserve dependency audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-audit-report
          path: eduos/artifacts/dependency-audit/npm-audit.json
          if-no-files-found: warn
          retention-days: 30
      # Always runs (after the evidence above is saved), so the log shows the
      # gate was checked: it used to be skipped whenever the audit was clean.
      - name: Enforce high-severity dependency gate
        if: always()
        run: |
          echo "dependency audit outcome: ${{ steps.dependency-audit.outcome }}"
          test "${{ steps.dependency-audit.outcome }}" = "success"

  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm, cache-dependency-path: eduos/package-lock.json }
      - run: npm ci
      # CMP-02: axe-core for the accessibility scan. Pinned, installed outside the
      # project (like playwright-core in e2e), scripts disabled.
      - run: npm install --prefix "$RUNNER_TEMP/a11y" --no-save --ignore-scripts axe-core@4.14.1
      # Includes test/browser/app-smoke.test.js: the web app booted in headless
      # Chrome (preinstalled on the runner) for every role and tab, each scanned
      # with axe-core for WCAG 2.2 A/AA (desktop and 390px) and checked for reflow at 320px.
      - run: npm test
        env:
          EDUOS_REQUIRE_BROWSER: "1"
          EDUOS_REQUIRE_AXE: "1"
          EDUOS_AXE_PATH: ${{ runner.temp }}/a11y/node_modules/axe-core/axe.min.js

  integration:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: ci-only-password }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm, cache-dependency-path: eduos/package-lock.json }
      - run: npm ci
      - run: npm run test:integration
        env:
          EDUOS_TEST_PG_URL: postgres://postgres:ci-only-password@127.0.0.1:5432/postgres

  edge:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Edge platform unit tests
        working-directory: eduos/edge-platform/eduos
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest tests/test_enrollment.py tests/test_enrollment_token.py tests/test_edge_config.py tests/test_update_agent.py tests/test_health_agent.py
      - name: ShellCheck the edge agents
        working-directory: eduos/edge-platform/eduos
        run: shellcheck scripts/eduos-update.sh scripts/eduos-health.sh
      - name: Butane render + checks
        run: |
          curl -fsSL -o /tmp/butane https://github.com/coreos/butane/releases/download/v0.23.0/butane-x86_64-unknown-linux-gnu
          # Pinned checksum. Taken from a download whose PGP signature verified with
          # the Fedora 40 primary key (115D F9AE F857 853E E844 5D0A 0727 707E A15B 79CC),
          # which signs Butane releases. Bumping Butane means re-verifying and updating this.
          echo "5833ce9f9c2932d9b02bc05821ffb6927d1e896a524c8dd53a4c9d2d90c47e2c  /tmp/butane" | sha256sum -c -
          chmod +x /tmp/butane
          make -C edge-platform/eduos check BUTANE=/tmp/butane
      # Edge Phase 2: build every edge image and scan it, like the app image.
      - name: Build the edge container images
        working-directory: eduos/edge-platform/eduos
        run: |
          for name in enrollment health; do
            docker build -f containers/Containerfile.$name -t eduos-edge-$name:ci .
          done
          test "$(docker run --rm --entrypoint id eduos-edge-health:ci -u)" = 10003
      - name: Scan the edge enrollment image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: { scan-type: image, image-ref: 'eduos-edge-enrollment:ci', scanners: vuln, severity: 'HIGH,CRITICAL', ignore-unfixed: true, format: table, exit-code: '1' }
      - name: Scan the edge health image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: { scan-type: image, image-ref: 'eduos-edge-health:ci', scanners: vuln, severity: 'HIGH,CRITICAL', ignore-unfixed: true, format: table, exit-code: '1' }

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - name: Start the stack (make up)
        run: make up
      - name: HTTP smoke test
        run: make smoke
      - name: Browser smoke test (headless Chrome)
        run: |
          # axe-core too: without it the axe scan below was silently skipped (CMP-02).
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --ignore-scripts playwright-core@1.65.1 axe-core@4.14.1
          export EDUOS_REQUIRE_AXE=1
          EDUOS_PLAYWRIGHT_DIR="$RUNNER_TEMP/pw" EDUOS_SCREENSHOT_DIR=artifacts/screens CHROME_PATH=$(command -v google-chrome) node dev/browser-smoke.mjs
      - name: Live CSP through the edge (headers, every page and role screen in Chrome)
        run: EDUOS_PLAYWRIGHT_DIR="$RUNNER_TEMP/pw" CHROME_PATH=$(command -v google-chrome) ./scripts/smoke.sh --csp
      - name: Logs on failure
        if: failure()
        run: EDUOS_ENV_FILE=.env.dev docker compose --env-file .env.dev -f docker-compose.yml -f docker-compose.dev.yml --profile edge logs --tail 200
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with: { name: e2e-screenshots, path: eduos/artifacts/screens, if-no-files-found: ignore }
      - name: Stop
        if: always()
        run: make down-volumes

  flutter-mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true
      - name: Resolve Flutter dependencies (from the committed lockfile)
        working-directory: eduos/mobile/flutter
        run: flutter pub get --enforce-lockfile
      - name: Analyze Dart sources
        working-directory: eduos/mobile/flutter
        run: flutter analyze --fatal-infos
      - name: Run Flutter unit and widget tests
        working-directory: eduos/mobile/flutter
        run: flutter test --reporter expanded
      - name: Compile Android debug application
        working-directory: eduos/mobile/flutter
        # Maven Central sometimes answers Gradle's dependency downloads with
        # HTTP 429 (Too Many Requests). Retry the build with a back-off rather
        # than failing the required check on a rate limit; real compile errors
        # still fail after the last attempt.
        run: |
          for attempt in 1 2 3; do
            flutter build apk --debug && exit 0
            echo "::warning::flutter build apk failed (attempt $attempt of 3); retrying after back-off"
            sleep $((attempt * 45))
          done
          exit 1
      - name: Upload debug APK for device testing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: eduos-android-debug-apk
          path: eduos/mobile/flutter/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  # 37.8: the Roku channel (eduos/clients/roku). Lints BrightScript and packages
  # the sideloadable ZIP. This job is required by the active Bot1 ruleset.
  # It does not sign or publish the channel.
  roku-channel:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: eduos/clients/roku
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm, cache-dependency-path: eduos/clients/roku/package-lock.json }
      - run: npm ci --ignore-scripts
      - name: Lint the channel (brighterscript + bslint)
        run: npm run lint
      - name: Package the channel
        run: npm run build
      - name: Upload the sideloadable channel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: eduos-roku-channel
          path: eduos/clients/roku/out/eduos-roku.zip
          if-no-files-found: error
          retention-days: 14

  # Native Apple-platform validation. This deliberately builds for the iOS
  # Simulator without signing, so pull requests need no Apple certificates,
  # provisioning profiles, or App Store Connect secrets.
  ios-simulator:
    runs-on: macos-15
    timeout-minutes: 35
    defaults:
      run:
        working-directory: eduos/mobile/flutter
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true
      - name: Record Apple toolchain
        run: |
          xcodebuild -version
          xcrun simctl list devices available
      - name: Resolve Flutter dependencies (from the committed lockfile)
        run: flutter pub get --enforce-lockfile
      - name: Compile iOS Simulator application without signing
        run: flutter build ios --simulator --no-codesign --debug
      - name: Upload iOS Simulator application
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: eduos-ios-simulator-app
          path: eduos/mobile/flutter/build/ios/iphonesimulator/Runner.app
          if-no-files-found: error
          retention-days: 14
